name: React apps
on:
  pull_request:
  push:
    branches: [main, issue-5-rotationcheck-routing, issue-21-geofence-generator]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: git submodule update --init --depth 1 modules/JsDataflashParser modules/plotly.js modules/fft.js modules/tabulator
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm typecheck && pnpm lint
      - run: pnpm test && pnpm test:routing && pnpm test:rotation-check && pnpm test:parameters && pnpm test:react-workflows
      - run: pnpm test:portal && pnpm test:rotation-check:browser && pnpm test:react-workflows:browser
      - run: pnpm test:numerics && pnpm test:geofence && pnpm test:geofence:browser
      - run: pnpm test:numerics:browser && pnpm test:mavlink:browser && pnpm test:transfers:browser && pnpm test:parameters:browser
