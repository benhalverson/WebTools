name: React apps
on:
  pull_request:
  push:
    branches: [main, issue-5-rotationcheck-routing, issue-11-hardware-parameters]
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: git submodule update --init --depth 1 modules/JsDataflashParser modules/plotly.js modules/fft.js modules/tabulator
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck && pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:stream-stats:browser
  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - suite: pid-review
            script: test:pid-review:browser
          - suite: scurve-tool
            script: test:scurve-tool:browser
          - suite: portal
            script: test:portal
          - suite: rotation-check
            script: test:rotation-check:browser
          - suite: react-workflows
            script: test:react-workflows:browser
          - suite: hardware-parameters
            script: test:hardware-parameters:browser
          - suite: kinematic-tools
            script: test:kinematic-tools:browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: git submodule update --init --depth 1 modules/JsDataflashParser modules/plotly.js modules/fft.js modules/tabulator
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm ${{ matrix.script }}
  validate:
    if: ${{ always() }}
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check and browser suite to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success
